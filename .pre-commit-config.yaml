repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty
        args: [check]
        language: python
        additional_dependencies: [ty]
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (dardcollect/pipeline layer DAG)
        entry: lint-imports --config pyproject.toml
        language: python
        additional_dependencies: [import-linter>=2.0]
        types: [python]
        pass_filenames: false
      - id: validate-harness
        name: validate-harness (AI-agent harness structural checks)
        # Exit-code contract: 0 = clean, 2 = warnings-only (advisory checks),
        # 1 = hard failures. pre-commit fails a hook on ANY nonzero exit, so
        # this wrapper accepts rc==2 (warnings print in the report) and
        # forwards everything else. CI uses the same wrapper (ci.yml).
        entry: python scripts/hook_validate_harness.py
        language: python
        # ruff + vulture back the code-quality ratchet check inside the validator.
        additional_dependencies: [ruff, vulture]
        pass_filenames: false
