repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown hard line breaks are two-or-more trailing spaces; without
        # this the hook strips them, silently rewriting every .md it touches
        # (the commit aborts and the rewrite must be re-staged).
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty
        args: [check]
        language: python
        additional_dependencies: [ty]
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (dardcollect/pipeline layer DAG)
        entry: lint-imports --config pyproject.toml
        language: python
        additional_dependencies: [import-linter>=2.0]
        types: [python]
        pass_filenames: false
      - id: validate-harness
        name: validate-harness (AI-agent harness structural checks)
        # Exit-code contract: 0 = clean, 2 = warnings-only (advisory checks),
        # 1 = hard failures. pre-commit fails a hook on ANY nonzero exit, so
        # this wrapper accepts rc==2 (warnings print in the report) and
        # forwards everything else. `--sync-mirror` refreshes and stages the
        # derived `.claude/skills/` mirror from the canonical `.agents/skills/`
        # tree before validating, so a stale mirror cannot be committed; CI
        # (ci.yml) runs the wrapper WITHOUT the flag so committed drift is
        # reported by the `skill mounts` gate instead of being repaired silently.
        entry: python scripts/hook_validate_harness.py --sync-mirror
        language: python
        # ruff + vulture back the code-quality ratchet check inside the
        # validator; pyyaml backs the strict skill-frontmatter check. The hook
        # runs in pre-commit's isolated env, so every validator dependency that
        # is not stdlib must be listed here or the check reports unchecked.
        additional_dependencies: [ruff, vulture, pyyaml]
        pass_filenames: false
